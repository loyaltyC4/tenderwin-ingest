name: WA documents (Mac runner)
# Tenders WA blocks GitHub's and Vercel's datacentre IPs, so this job runs on the owner's Mac (a home connection).
# Scheduled and manual runs only: this workflow must never run on pull requests (the runner is a personal machine).
on:
  schedule:
    - cron: "40 */3 * * *"
  workflow_dispatch:
    inputs:
      wa_docs_limit: { description: "Max document packs to download this run", default: "25" }
      wa_docs_dry: { description: "1 = log in and read lists but store nothing", default: "0" }
concurrency: { group: wa-docs-mac, cancel-in-progress: false }
jobs:
  wa-docs:
    if: github.repository == 'loyaltyC4/tenderwin-ingest'
    runs-on: [self-hosted, mac-au-wa]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-audit --no-fund
      - name: Tenders WA list scan (home IP, so no Firecrawl credits)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node -e "import('./lib/tender-feed.js').then(async m => { const r = await m.runStatePortalsIngest({ force: true, only: ['wa-tenders'] }); console.log(JSON.stringify(r).slice(0, 600)); })"
      - name: Tenders WA documents
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ENDPOINT: ${{ secrets.R2_ACCOUNT_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_DOCS_BUCKET: ${{ secrets.R2_DOCS_BUCKET }}
          WA_USER: ${{ secrets.WA_USER }}
          WA_PASS: ${{ secrets.WA_PASS }}
          GMAIL_USER: ${{ secrets.WA_GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.WA_GMAIL_APP_PASS }}
          WA_DOCS_LIMIT: ${{ github.event.inputs.wa_docs_limit || '25' }}
          WA_DRY: ${{ github.event.inputs.wa_docs_dry || '0' }}
        run: node scripts/wa-docs.mjs
